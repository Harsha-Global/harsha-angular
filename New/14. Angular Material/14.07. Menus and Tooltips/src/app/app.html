<mat-toolbar class="primary-toolbar">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>

  <span>Task Flow</span>

  <span class="spacer"></span>

  <button mat-icon-button matTooltip="View notifications">
    <mat-icon>notifications</mat-icon>
  </button>

  <button mat-icon-button matTooltip="Your profile">
    <mat-icon>account_circle</mat-icon>
  </button>

</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav mode="over" #sidenav>
    <button mat-button class="nav-item">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </button>
    <button mat-button class="nav-item">
      <mat-icon>check_circle</mat-icon>
      My Tasks
    </button>
    <button mat-button class="nav-item">
      <mat-icon>calendar_today</mat-icon>
      Calendar
    </button>
    <mat-divider></mat-divider>
    <button mat-button class="nav-item">
      <mat-icon>settings</mat-icon>
      Settings
    </button>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content">
      <h1>Welcome to Task Flow</h1>

      <button mat-flat-button (click)="openConfirmDialog()" class="warn">Delete Task</button>

      <section class="demo-section">
        <h2>Progress Spinner</h2>

        <div class="example-row">
          <div class="example-item">
            <h3>Indeterminate</h3>
            <mat-spinner></mat-spinner>
          </div>
        </div>

        <div class="example-row">
          <div class="example-item">
            <h3>Warning Spinner</h3>
            <mat-spinner [diameter]="40" class="warn-spinner"></mat-spinner>
          </div>
        </div>

        <div class="example-row">
          <div class="example-item">
            <h3>Determinate (65%)</h3>
            <mat-progress-spinner mode="determinate" [value]="65" [diameter]="40" [strokeWidth]="8"></mat-progress-spinner>
          </div>
        </div>
      </section>

      <section class="demo-section">
        <h2>Progress Bar</h2>

        <div class="example-item">
          <h3>Indeterminate</h3>
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </div>

        <div class="example-item">
          <h3>Determinate</h3>
          <mat-progress-bar mode="determinate" [value]="40" class="accent-bar"></mat-progress-bar>
        </div>

        <div class="example-item">
          <h3>Buffer (35% played / 60% buffered)</h3>
          <mat-progress-bar mode="buffer" [value]="35" [bufferValue]="60"></mat-progress-bar>
        </div>

        <div class="example-item">
          <h3>Query</h3>
          <mat-progress-bar mode="query"></mat-progress-bar>
        </div>
      </section>

      <section class="demo-section">
        <h2>Menu</h2>

        <div class="example-row">
          <button mat-flat-button [matMenuTriggerFor]="actionsMenu">
            <mat-icon>more_vert</mat-icon>
          </button>

          <mat-menu #actionsMenu="matMenu">
            <button mat-menu-item (click)="onMenuAction('edit')">
              <mat-icon>edit</mat-icon>
              Edit
            </button>

            <button mat-menu-item (click)="onMenuAction('duplicate')">
              <mat-icon>content_copy</mat-icon>
              Duplicate
            </button>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="onMenuAction('delete')">
              <mat-icon>delete</mat-icon>
              Delete
            </button>

          </mat-menu>

          <button mat-flat-button [matMenuTriggerFor]="settingsMenu">
            <mat-icon>settings</mat-icon>
            Settings
          </button>

          <mat-menu #settingsMenu="matMenu">
            <button mat-menu-item>
              <mat-icon>person</mat-icon>
              Profile
            </button>

            <button mat-menu-item [matMenuTriggerFor]="themeMenu">
              <mat-icon>palette</mat-icon>
              Theme
            </button>

            <button mat-menu-item>
              <mat-icon>logout</mat-icon>
              Logout
            </button>
          </mat-menu>

          <mat-menu #themeMenu="matMenu">
            <button mat-menu-item>
              <mat-icon>light_mode</mat-icon>
              Light
            </button>

            <button mat-menu-item>
              <mat-icon>dark_mode</mat-icon>
              Dark
            </button>

            <button mat-menu-item>
              <mat-icon>computer</mat-icon>
              System
            </button>
          </mat-menu>
        </div>
      </section>

      <section class="demo-section">
        <h2>Tooltips</h2>

        <div class="example-row">
          <button mat-flat-button matTooltip="Click to save your changes">Save</button>

          <button mat-flat-button matTooltip="Tooltip above" matTooltipPosition="above">Above</button>

          <button mat-flat-button matTooltip="Tooltip on the left" matTooltipPosition="left">Left</button>

          <button mat-flat-button matTooltip="Tooltip on the right" matTooltipPosition="right">Right</button>

          <button mat-flat-button matTooltip="This tooltip has a delay" matTooltipPosition="right" [matTooltipShowDelay]="500" [matTooltipHideDelay]="1000">Delayed</button>
        </div>
      </section>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
