<mat-stepper orientation="horizontal" #stepper linear>
 <mat-step label="Personal Information" [stepControl]="personalInfoForm">
  <form [formGroup]="personalInfoForm">
   <mat-form-field class="form-field">
    <mat-label>First Name</mat-label>
    <input matInput type="text" formControlName="firstName" name="firstName" />
   </mat-form-field>

   <mat-form-field class="form-field">
    <mat-label>Last Name</mat-label>
    <input matInput type="text" formControlName="lastName" name="lastName" />
   </mat-form-field>

   <mat-form-field class="form-field">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" name="email" />
   </mat-form-field>

   <mat-form-field class="form-field">
    <mat-label>Phone Number</mat-label>
    <input matInput type="tel" formControlName="phone" name="phone" />
   </mat-form-field>
  </form>
  <div class="step-actions">
   <button matButton matStepperNext>Next</button>
  </div>
 </mat-step>

 <mat-step label="Professional Details" [stepControl]="professionalDetailsForm">
  <p>Professional details form fields will go here.</p>

  <div class="step-actions">
   <button matButton matStepperPrevious>Back</button>
   <button matButton matStepperNext>Next</button>
  </div>
 </mat-step>

 <mat-step label="Job Preferences" [stepControl]="jobPreferencesForm">
  <p>Job preferences form fields will go here.</p>

  <div class="step-actions">
   <button matButton matStepperPrevious>Back</button>
   <button matButton matStepperNext>Next</button>
  </div>
 </mat-step>

 <mat-step label="Review" [stepControl]="reviewForm">
  <p>Review your application before submitting.</p>

  <div class="step-actions">
   <button matButton matStepperPrevious>Back</button>
   <button matButton="filled" >Submit</button>
  </div>
 </mat-step>
</mat-stepper>
