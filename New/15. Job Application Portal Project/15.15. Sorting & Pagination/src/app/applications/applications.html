<h1>Applications</h1>
<table mat-table [dataSource]="dataSource" matSort>

 <ng-container matColumnDef="id">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
  <td mat-cell *matCellDef="let application">{{application.id}}</td>
 </ng-container>

 <ng-container matColumnDef="firstName">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
  <td mat-cell *matCellDef="let application">{{application.firstName}}</td>
 </ng-container>

 <ng-container matColumnDef="lastName">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
  <td mat-cell *matCellDef="let application">{{application.lastName}}</td>
 </ng-container>

 <ng-container matColumnDef="email">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
  <td mat-cell *matCellDef="let application">{{application.email}}</td>
 </ng-container>

 <ng-container matColumnDef="position">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>Position</th>
  <td mat-cell *matCellDef="let application">{{application.position}}</td>
 </ng-container>

 <ng-container matColumnDef="status">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
  <td mat-cell *matCellDef="let application">{{application.status}}</td>
 </ng-container>

 <ng-container matColumnDef="appliedDate">
  <th mat-header-cell *matHeaderCellDef mat-sort-header>Applied On</th>
  <td mat-cell *matCellDef="let application">{{application.appliedDate | date: 'mediumDate'}}</td>
 </ng-container>

 <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

 <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" [pageSize]="5" showFirstLastButtons="true">
</mat-paginator>
