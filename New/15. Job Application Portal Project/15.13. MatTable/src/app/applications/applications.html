<h1>Applications</h1>
<table mat-table [dataSource]="dataSource">

 <ng-container matColumnDef="id">
  <th mat-header-cell *matHeaderCellDef>ID</th>
  <td mat-cell *matCellDef="let application">{{application.id}}</td>
 </ng-container>

 <ng-container matColumnDef="firstName">
  <th mat-header-cell *matHeaderCellDef>First Name</th>
  <td mat-cell *matCellDef="let application">{{application.firstName}}</td>
 </ng-container>

 <ng-container matColumnDef="lastName">
  <th mat-header-cell *matHeaderCellDef>Last Name</th>
  <td mat-cell *matCellDef="let application">{{application.lastName}}</td>
 </ng-container>

 <ng-container matColumnDef="email">
  <th mat-header-cell *matHeaderCellDef>Email</th>
  <td mat-cell *matCellDef="let application">{{application.email}}</td>
 </ng-container>

 <ng-container matColumnDef="position">
  <th mat-header-cell *matHeaderCellDef>Position</th>
  <td mat-cell *matCellDef="let application">{{application.position}}</td>
 </ng-container>

 <ng-container matColumnDef="status">
  <th mat-header-cell *matHeaderCellDef>Status</th>
  <td mat-cell *matCellDef="let application">{{application.status}}</td>
 </ng-container>

 <ng-container matColumnDef="appliedDate">
  <th mat-header-cell *matHeaderCellDef>Applied On</th>
  <td mat-cell *matCellDef="let application">{{application.appliedDate | date: 'mediumDate'}}</td>
 </ng-container>

 <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

 <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
